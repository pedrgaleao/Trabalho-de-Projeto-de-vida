<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar objeto | Achei!</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/cadastrar.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="index.html"><span class="mini-mark">⌕</span> Achei!</a>
    <a class="text-link" href="procurar.html">Ver objetos encontrados</a>
  </header>

  <main class="page-container narrow">
    <a class="back-link" href="index.html">← Voltar ao início</a>
    <div class="page-heading">
      <span class="eyebrow">ACHADOS E PERDIDOS</span>
      <h1>Achou alguma coisa?</h1>
      <p>Preencha as informações abaixo para avisar à comunidade escolar.</p>
    </div>

    <form id="item-form" class="panel form-panel">
      <label for="photo">Foto do objeto <span class="required">*</span></label>
      <input id="photo" name="photo" type="file" accept="image/*" required>
      <small class="field-help">Envie uma foto nítida. Máximo de 5 MB.</small>
      <div id="photo-preview" class="photo-preview" hidden>
        <img id="preview-image" alt="Prévia da foto selecionada">
      </div>

      <label for="name">Nome do objeto <span class="required">*</span></label>
      <input id="name" name="name" type="text" maxlength="80" placeholder="Ex.: Garrafa azul" required>

      <label for="category">Categoria <span class="required">*</span></label>
      <select id="category" name="category" required>
        <option value="">Selecione uma categoria</option>
        <option>Material escolar</option>
        <option>Roupas e acessórios</option>
        <option>Eletrônicos</option>
        <option>Garrafas e lancheiras</option>
        <option>Chaves e outros</option>
        <option>Outros</option>
      </select>

      <label for="location">Onde encontrou? <span class="required">*</span></label>
      <input id="location" name="location" type="text" maxlength="120" placeholder="Ex.: Pátio, perto da cantina" required>

      <label for="description">Detalhes adicionais</label>
      <textarea id="description" name="description" rows="3" maxlength="500" placeholder="Descreva características que ajudem a identificar o objeto (opcional)."></textarea>

      <p class="privacy-note">Não publique documentos, dados pessoais, números de telefone ou imagens de pessoas.</p>
      <button class="button button-primary full-width" id="submit-button" type="submit">Publicar objeto encontrado</button>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
